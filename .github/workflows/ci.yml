# Quality gate for every workspace (shared packages, website, dashboards, mobile app).
# Runs on every pull request into dev/main and on pushes to them, so "apps-ci"
# can be a required status check. Apps take part automatically once they
# exist under apps/ and define lint / typecheck / test / build scripts.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when reused, so mobile-update's call
  # does not queue behind this workflow's own push run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: apps-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-time API URLs. Set the DEV_API_URL repository variable once the dev API is deployed.
      API_URL: ${{ vars.DEV_API_URL || 'http://localhost:8080' }}
      NEXT_PUBLIC_API_URL: ${{ vars.DEV_API_URL || 'http://localhost:8080' }}
      VITE_API_URL: ${{ vars.DEV_API_URL || 'http://localhost:8080' }}
      EXPO_PUBLIC_API_URL: ${{ vars.DEV_API_URL || 'http://localhost:8080' }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
